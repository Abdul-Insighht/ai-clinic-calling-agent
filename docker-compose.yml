services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aibitsol}
      POSTGRES_USER: ${POSTGRES_USER:-aibitsol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aibitsol} -d ${POSTGRES_DB:-aibitsol}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-aibitsol}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aibitsol}
    command: ['node', 'src/db/migrate.ts']

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-aibitsol}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aibitsol}
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CALENDAR_TIME_ZONE: ${GOOGLE_CALENDAR_TIME_ZONE:-America/Chicago}
      GOOGLE_CALENDAR_CLIENT_EMAIL: ${GOOGLE_CALENDAR_CLIENT_EMAIL:-}
      GOOGLE_CALENDAR_PRIVATE_KEY: ${GOOGLE_CALENDAR_PRIVATE_KEY:-}
      GOOGLE_CALENDAR_CREDENTIALS_JSON: ${GOOGLE_CALENDAR_CREDENTIALS_JSON:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: aibitsol-api
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3001/health/live\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-aibitsol}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aibitsol}
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-2.5-flash-native-audio-preview-12-2025}
      GEMINI_VOICE: ${GEMINI_VOICE:-Puck}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CALENDAR_TIME_ZONE: ${GOOGLE_CALENDAR_TIME_ZONE:-America/Chicago}
      GOOGLE_CALENDAR_CLIENT_EMAIL: ${GOOGLE_CALENDAR_CLIENT_EMAIL:-}
      GOOGLE_CALENDAR_PRIVATE_KEY: ${GOOGLE_CALENDAR_PRIVATE_KEY:-}
      GOOGLE_CALENDAR_CREDENTIALS_JSON: ${GOOGLE_CALENDAR_CREDENTIALS_JSON:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: aibitsol-agent-worker
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:8080'
    deploy:
      resources:
        limits:
          memory: 128M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./infrastructure/monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
